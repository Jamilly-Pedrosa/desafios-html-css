<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cartão de Perfil</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="cartao-perfil">
        <img src="img/perfil.jpg" alt="Ilustração de perfil" class="foto-perfil">
        
        <div class="informacoes-perfil">

            <div class="cartao-perfil-nome">
                <h2>Jamilly Pedrosa</h2>
                <span class="verificado">✔</span>
            </div>
            
            <p class="cartao-perfil-descricao">
                Desenvolvedora Frontend & UX/UI Designer
            </p>
           
        </div>

        <div class="cartao-perfil-footer">
            <button class="seguir-btn">Seguir +</button>
        </div>
    </div>

</body>
</html>
